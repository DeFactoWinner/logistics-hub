name: CI

on:
  pull_request:
    branches: [ "dev" ]
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
          - gateway
          - hub-service
          - delivery-service
          - order-service
          - user-service
          - product-service
          - eureka-server
          - company-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew
        working-directory: ./${{ matrix.service }}

      - name: Build and test
        run: ./gradlew clean build
        working-directory: ./${{ matrix.service }}