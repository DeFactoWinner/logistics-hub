spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: user-service
              uri: lb://USER-SERVICE
              predicates:
                - Path=/api/v1/users/**, /api/v1/auth/**, /api/v1/admin/users/**

            - id: order-service
              uri: lb://ORDER-SERVICE
              predicates:
                - Path=/api/v1/orders/**

            - id: product-service
              uri: lb://PRODUCT-SERVICE
              predicates:
                - Path=/api/v1/products/**

            - id: company-service
              uri: lb://COMPANY-SERVICE
              predicates:
                - Path=/api/v1/companies/**

            - id: delivery-service
              uri: lb://DELIVERY-SERVICE
              predicates:
                - Path=/api/v1/deliveries/**, /api/v1/delivery-managers/**

            - id: hub-service
              uri: lb://HUB-SERVICE
              predicates:
                - Path=/api/v1/hubs/**

            - id: hub-path-service
              uri: lb://HUB-PATH-SERVICE
              predicates:
                - Path=/api/v1/hub-routes/**

            - id: slack-service
              uri: lb://SLACK-SERVICE
              predicates:
                - Path=/api/v1/notifications/**, /api/v1/slacks/**