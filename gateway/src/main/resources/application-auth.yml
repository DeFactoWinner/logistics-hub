app:
  auth:
    white-list:
      - "/api/v1/auth/login"
      - "/api/v1/auth/signup"
      - "/api/v1/auth/refresh"
      - "/api/v1/public/**"
      - "/swagger-ui/**"
      - "/v3/api-docs/**"

    status-allow-list:
      - "/api/v1/users/me"
      - "/api/v1/auth/logout"

    access-control:
      - path: "/api/v1/admin/**"
        roles: [ "MASTER" ]